# Production on the 1 GB server. scripts/deploy.sh runs:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Docker bypasses the ufw firewall: any `ports:` entry is open to the internet.
# Only Caddy publishes ports; the API and Postgres are reached by service name.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"  # the disk is small: keep at most 30 MB of logs per container
    max-file: "3"

services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 320m
    logging: *logging

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: production
      STORAGE: r2
    # One worker process: stories run one at a time inside it.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 450m
    logging: *logging

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv/web:ro
      - caddy_data:/data  # HTTPS certificates: keep them, or Let's Encrypt may rate-limit new ones
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
