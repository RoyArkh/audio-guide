# Local development. Start everything with:  docker compose up --build
# Values like ${POSTGRES_USER} come from the .env file next to this one.

services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Same small-server tuning we'll use in production (1 GB RAM).
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20"]
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker,
      # so the volume is mounted one level up.
      - pgdata:/var/lib/postgresql
    ports:
      # Bound to 127.0.0.1 so only this machine can connect (for psql/GUI tools).
      # 5433 on the host because 5432 is taken by a locally installed Postgres.
      # Production will have NO ports entry for the database at all.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      # "db" is the service name above: Compose puts both containers on a private
      # network where each service is reachable by its name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Apply migrations, then start uvicorn with auto-reload on code changes.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    volumes:
      # Mount the source code into the container so edits on the Mac show up instantly.
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
